name: SiliconMark CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify CLI installation and device probe
        run: |
          siliconmark info --device cpu
          siliconmark list-hardware
          siliconmark list-models
          siliconmark roofline --device cpu

      - name: Run unit test suite
        run: |
          pytest -v -k "not test_cli_run_quick and not test_runner_quick_mode"

      - name: Run quick benchmark and compare against baselines
        run: |
          siliconmark run --device cpu --quick --ci
          siliconmark compare rtx4090 m3max
